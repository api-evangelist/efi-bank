aid: efi-bank
url: https://raw.githubusercontent.com/api-evangelist/efi-bank/refs/heads/main/apis.yml
name: Efí
kind: company
description: Efí (formerly Gerencianet) is a Brazilian payment institution and digital
  bank that exposes well-documented public REST APIs for the Brazilian financial
  system - Pix (immediate and dated charges, send/receive, refunds, webhooks), Boletos
  and Charges (Cobranças), Carnê installment booklets, subscriptions and payment
  links, Pix via Open Finance, and account financial services. Pix and Open Finance
  APIs require OAuth2 client-credentials plus a mutual TLS (mTLS) client certificate
  as mandated by the Brazilian Central Bank; the Cobranças API uses OAuth2 without
  mTLS.
