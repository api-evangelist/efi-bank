  endpointsModeled:
    - PUT    https://pix.api.efipay.com.br/v2/cobv/{txid}   # dated charge - BACEN Pix v2 standard Efí implements
    - GET    https://pix.api.efipay.com.br/v2/cobv/{txid}
    - POST   https://pix.api.efipay.com.br/v2/loc           # payload location - BACEN Pix v2 standard
    - GET    https://pix.api.efipay.com.br/v2/pix           # received Pix - BACEN Pix v2 standard
    - GET    https://pix.api.efipay.com.br/v2/pix/{e2eid}
    - PUT    https://pix.api.efipay.com.br/v2/pix/{e2eid}/devolucao/{id}  # refund - BACEN Pix v2 standard
    - GET    https://pix.api.efipay.com.br/v2/pix/{e2eid}/devolucao/{id}
    - GET    https://openfinance.api.efipay.com.br/v1/open-finance/participants   # representative path from documented scope gn.opb.participants.read
    - POST   https://openfinance.api.efipay.com.br/v1/open-finance/payments/pix   # representative path from documented scope gn.opb.payment.pix.send
  modeledNote: |
    Endpoints under endpointsModeled follow the Brazilian Central Bank Pix API v2
    standard that Efí implements (Efí advertises "nota máxima" / maximum rating
    from Banco Central for its full Pix API, including CobV, Cash-In, Cash-Out,
    Split, and reconciliation), and the Open Finance paths are representative
    reconstructions from Efí's documented OAuth scopes. Their existence is
    well-grounded; the exact path strings should be verified against the live
    reference before production use.
sources:
  - url: https://dev.efipay.com.br/docs/api-pix/credenciais
    type: Documentation
    note: Pix API base URLs, OAuth2 client-credentials at POST /oauth/token, and mandatory P12/PEM mTLS certificate.
  - url: https://dev.efipay.com.br/docs/api-pix/cobrancas-imediatas
    type: APIReference
    note: Immediate charge (cob) CRUD - POST/PUT/PATCH/GET /v2/cob(/{txid}) confirmed.
  - url: https://dev.efipay.com.br/docs/api-pix/webhooks
    type: APIReference
    note: Pix webhook registration - PUT/GET/DELETE /v2/webhook/{chave}, GET /v2/webhook confirmed.
  - url: https://dev.efipay.com.br/docs/api-cobrancas/credenciais
    type: Documentation
    note: Cobranças base URLs, OAuth2 at POST /v1/authorize, no mTLS required.
  - url: https://dev.efipay.com.br/docs/api-cobrancas/boleto
    type: APIReference
    note: Charge CRUD under /v1/charge, /v1/charges confirmed.
  - url: https://dev.efipay.com.br/docs/api-cobrancas/carne
    type: APIReference
    note: Carnê CRUD under /v1/carnet confirmed.
  - url: https://dev.efipay.com.br/docs/api-open-finance/credenciais
    type: Documentation
    note: Open Finance base URLs, OAuth2 at POST /v1/oauth/token, mandatory mTLS, gn.opb.* scopes.
  - url: https://sejaefi.com.br/tarifas
    type: Pricing
    note: Per-transaction pricing (Pix 1.19%, boleto/carnê confirmation fee, Pix Automático R$3.50).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Efí's own API. Efí's public API is
    request/response REST (Pix, Cobranças, Carnê, Open Finance) plus HTTP webhook
    callbacks for received-Pix and charge notifications. No AsyncAPI document was
    created because there is no server-push socket transport (ws:// or wss://) to
    model; webhooks are server-to-endpoint HTTP and are represented as REST
    registration operations.
