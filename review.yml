aid: efi-bank
name: Efí
review:
  question: Does Efí expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Efí's public API surface (Pix, Cobranças,
    Carnê, and Pix via Open Finance) is request/response REST over HTTPS. Efí's
    only asynchronous, server-initiated mechanism is HTTP webhooks - Efí POSTs
    received-Pix and charge notifications to a caller-registered HTTPS callback
    URL (PUT /v2/webhook/{chave} to register). That is server-to-endpoint HTTP,
    not a bidirectional WebSocket (ws:// or wss://) transport, so there is no
    server-push socket protocol on Efí's own API to model with AsyncAPI.
findings:
  summary: |
    Efí (formerly Gerencianet) does not publish a documented public WebSocket
    API. Efí is a Brazilian payment institution and digital bank. Its public
    products are REST APIs over HTTPS across three hosts: the Pix API
    (https://pix.api.efipay.com.br), the Cobranças / Charges API
    (https://cobrancas.api.efipay.com.br), and the Pix via Open Finance API
    (https://openfinance.api.efipay.com.br). Authentication is OAuth2
    client-credentials on every host; the Pix and Open Finance hosts additionally
    REQUIRE a mutual TLS (mTLS) client certificate on every request per Brazilian
    Central Bank rules, while the Cobranças host uses OAuth2 alone. Asynchronous
    delivery is via HTTP webhooks (received-Pix and charge notifications POSTed to
    a registered HTTPS callback), not via WebSocket. No ws:// or wss:// endpoint
    is documented anywhere in Efí's developer documentation as of the review date.
  rebrandNote: |
    Efí was formerly named Gerencianet and rebranded to Efí (Efí Bank). The
    company, CNPJ (09.089.356/0001-18), and products are continuous across the
    rename. Legacy artifacts still carry the old identity: older host names,
    SDK package names, and OAuth scope prefixes such as `gn.opb.*` in the Open
    Finance API reflect the Gerencianet lineage. This entry uses the current
    efipay.com.br / sejaefi.com.br hosts.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://pix.api.efipay.com.br
      documented: true
      note: Pix API. OAuth2 client-credentials PLUS mandatory mTLS client certificate. Sandbox https://pix-h.api.efipay.com.br.
    - protocol: REST
      scheme: https
      baseURL: https://cobrancas.api.efipay.com.br
      documented: true
      note: Cobranças (Charges / Carnê) API. OAuth2 client-credentials, no mTLS. Sandbox https://cobrancas-h.api.efipay.com.br.
    - protocol: REST
      scheme: https
      baseURL: https://openfinance.api.efipay.com.br
      documented: true
      note: Pix via Open Finance API. OAuth2 client-credentials PLUS mandatory mTLS. Sandbox https://openfinance-h.api.efipay.com.br.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Efí POSTs received-Pix and charge notifications to a caller-registered HTTPS callback URL. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Efí's Pix, Cobranças, or Open Finance API reference as of the review date.
