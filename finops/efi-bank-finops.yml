meters:
- name: pix_received
  description: Pix received via API (Cob / CobV), billed as a percentage of the transaction value (~1.19% advertised; unreconciled).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - pix_key
- name: boleto_settled
  description: Boletos and carnê parcels actually paid, each billed a fixed confirmation fee (~R$3.45 advertised; unreconciled). Generation is free.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - charge_type
- name: pix_automatico_settled
  description: Automatic Pix settlements, billed a fixed fee per liquidated Pix (~R$3.50 advertised; unreconciled).
  unit: transactions
  aggregation: sum
  dimensions:
  - account
- name: open_finance_initiation
  description: Pix payments initiated via Open Finance as a payment initiator; pricing negotiated per partner.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - participant
principles:
- name: Visibility
  description: Track settled-transaction counts and value per Pix key and charge type; reconcile the percentage Pix fee and fixed boleto fee against the tarifas page monthly.
- name: Allocation
  description: Use per-charge custom_id / notification metadata and distinct Pix keys to map transaction fees to products, teams, or marketplace sellers (payment split).
- name: Optimization
  description: Steer customers toward the lowest-fee settled instrument for each amount - a percentage Pix fee is cheaper on small tickets while a fixed boleto fee is cheaper on large tickets; use the 30 free monthly Pix allowance; avoid generating charges that will not be paid since only settlements are billed.
- name: Accountability
  description: Assign an owner per Efí account / sub-merchant; review monthly settled volume and fee mix against negotiated-rate thresholds and renegotiate at higher volume.
