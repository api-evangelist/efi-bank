description: >-
  FinOps view of Efí (formerly Gerencianet) spend. Unlike a SaaS API where you
  pay per API call or per seat, Efí is a payment institution: its APIs are free to
  call, and cost is incurred PER SETTLED TRANSACTION. The dominant cost drivers
  are (1) Pix received via API, billed as a percentage of the transaction (~1.19%
  advertised standard), (2) boletos and carnê parcels, billed a fixed confirmation
  fee only when paid (~R$3.45 advertised), and (3) Pix Automático settlements
  (~R$3.50 advertised). Generating charges, opening the account, and holding
  credentials cost nothing. All amounts are in BRL and are unreconciled - these
  are per-transaction payment tariffs, not cloud/API metering, and they vary by
  negotiated volume.
notes: >-
  Per-unit rates here are advertised standard tariffs and are NOT reconciled;
  verify on https://sejaefi.com.br/tarifas. Because billing is per financial
  transaction, cost scales with settled payment volume and mix (Pix % vs. fixed
  boleto fee), so the FinOps focus is transaction-mix optimization rather than
  request-rate optimization.
